name: CI

# Secretos requeridos en el repositorio (Settings > Secrets and variables > Actions):
#   DB_PASSWORD  -> clave del usuario sa de SQL Server (también la usa Spring Boot en CI)
#   JWT_SECRET   -> clave de firma de los JWT (mínimo 32 caracteres)
# No se escriben credenciales reales en este archivo.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 25 + tests)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 1433:1433
      redis:
        image: redis:7
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    env:
      DB_URL: "jdbc:sqlserver://localhost:1433;databaseName=fitstore_db;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Esperar SQL Server y crear la base de datos
        env:
          SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.sqlserver.id }} \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server listo."
              break
            fi
            echo "Esperando SQL Server... ($i)"
            sleep 5
          done
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C \
            -Q "IF DB_ID('fitstore_db') IS NULL CREATE DATABASE fitstore_db"

      - name: Verificar formato (Spotless)
        working-directory: backend
        run: ./mvnw -B spotless:check

      - name: Compilar y ejecutar las pruebas
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (ESLint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Análisis de código (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Compilar frontend (Vite)
        working-directory: frontend
        run: npm run build
