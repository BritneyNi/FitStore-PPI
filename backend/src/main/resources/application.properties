# ============================================================
#  FitStore — application.properties (configuracion base)
#
#  Los valores sensibles (usuario/clave de BD y secreto JWT) NO
#  se versionan. Se definen en `application-local.properties`
#  (ignorado por Git) o mediante variables de entorno.
#  Ver `application-local.properties.example` y el README.
# ============================================================

# ── Perfil activo (local por defecto) ───────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── Servidor ────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── SQL Server ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=fitstore_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ── Repository scanning ────────────────────────────────────
spring.data.redis.repositories.enabled=false

# ── Redis (Cache-Aside — RNF-01: stock < 1 segundo) ────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2000ms

# ── RabbitMQ (notificaciones asincronas) ───────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

fitstore.rabbitmq.queue=${RABBITMQ_QUEUE:fitstore.pedidos.queue}
fitstore.rabbitmq.exchange=${RABBITMQ_EXCHANGE:fitstore.exchange}
fitstore.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:pedido.confirmado}

# ── JWT ─────────────────────────────────────────────────────
fitstore.jwt.secret=${JWT_SECRET}
fitstore.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ────────────────────────────────────────────────────
fitstore.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,null}

# ── Security auto-config cleanup ───────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── Logging ─────────────────────────────────────────────────
logging.level.com.fitstore=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
